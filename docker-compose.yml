version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: classroom_db
    environment:
      POSTGRES_DB: classroom_manager
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: classroom_password  # 生产环境改为强密码
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - classroom_net
    # 【关键】：不发布宿主机端口，数据库无公网路径
    expose:
      - "5432"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"        # 2C4G 单机适配
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_destination=stderr"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classroom_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://classroom:classroom_password@postgres:5432/classroom_manager
      SESSION_SECRET: ${SESSION_SECRET:-CHANGE_ME_IN_PRODUCTION_32_BYTES_MIN}
      API_PORT: 3000
      TZ: Asia/Shanghai
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPLAY_CHECKPOINT_EVENT_THRESHOLD: ${REPLAY_CHECKPOINT_EVENT_THRESHOLD:-200}
      ANON_LEDGER_KEY: ${ANON_LEDGER_KEY}
    volumes:
      # 备份目录只读挂载（删除由宿主机 cron 轮转）
      - backups:/app/backups:ro
      # 匿名化外部账本（必须独立于数据库备份，写入由应用负责）
      - anon_ledger:/app/anon-ledger
    networks:
      - classroom_net
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: classroom_nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro   # 前端静态资源（构建后）
      # HTTPS 证书（生产环境启用）
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - classroom_net
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  backups:
    driver: local
  anon_ledger:
    driver: local

networks:
  classroom_net:
    driver: bridge
