services:
  postgres:
    image: postgres:16-alpine
    container_name: classroom_db
    environment:
      POSTGRES_DB: classroom_manager
      POSTGRES_USER: classroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - classroom_net
    expose:
      - "5432"
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_destination=stderr"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classroom_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://classroom:${POSTGRES_PASSWORD}@postgres:5432/classroom_manager
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      API_PORT: 3000
      TZ: Asia/Shanghai
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPLAY_CHECKPOINT_EVENT_THRESHOLD: ${REPLAY_CHECKPOINT_EVENT_THRESHOLD:-200}
      ANON_LEDGER_KEY: ${ANON_LEDGER_KEY:?set ANON_LEDGER_KEY}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-true}
      TRUST_PROXY: "1"
      BACKUP_DIR: /app/backups
    volumes:
      - backups:/app/backups:ro
      - anon_ledger:/app/anon-ledger
    networks:
      - classroom_net
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classroom_backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://classroom:${POSTGRES_PASSWORD}@postgres:5432/classroom_manager
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: Asia/Shanghai
    volumes:
      - backups:/backups
    networks:
      - classroom_net
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["node", "dist/scripts/backup-scheduler.js"]

  nginx:
    image: nginx:alpine
    container_name: classroom_nginx
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./web/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs
    networks:
      - classroom_net
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

volumes:
  pgdata:
    driver: local
  backups:
    driver: local
  anon_ledger:
    driver: local

networks:
  classroom_net:
    driver: bridge
