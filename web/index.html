<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      移动端：允许缩放、不锁定 user-scalable。
      需求 §2「手机支持缩放、平移」——禁止缩放会让座位图在手机上无法使用。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="format-detection" content="telephone=no" />
    <title>电脑室学生积分管理系统</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
